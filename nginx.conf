server {
    listen 80;
    server_name localhost;
    resolver 127.0.0.11 valid=10s;

    # This server listens on 80 inside the container but is published on the
    # host's 8080, so it cannot build a correct absolute redirect: the Location
    # generated for a bare prefix such as /aco drops the port and sends the
    # client to the host's port-80 nginx. Relative redirects keep whatever port
    # the client already used.
    absolute_redirect off;

    # Allow big uploads
    client_max_body_size 500M;
    proxy_send_timeout 86400s;
    proxy_read_timeout 86400s;

    # -----------------------------------------------------------
    # AC Analyzer application - proxy to local Streamlit
    # -----------------------------------------------------------

    location /ac/ {
        proxy_pass http://ac-analyzer:8000/ac/; # Keep /ac/ here
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Streamlit
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;

        # IMPORTANT for large uploads via st.file_uploader
        proxy_request_buffering off; # stream to upstream instead of buffering to disk
        proxy_buffering off; # optional, avoids response buffering
    }

    # Static files and other Streamlit routes
    location ~ ^/ac/(.*) {
        proxy_pass http://ac-analyzer:8000/ac/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # -----------------------------------------------------------
    # PSD application - proxy to local Streamlit
    # -----------------------------------------------------------

    location /psd/ {
        proxy_pass http://psd-analyzer:8000/psd/; # Keep /psd/ here
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Streamlit
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;

        # IMPORTANT for large uploads via st.file_uploader
        proxy_request_buffering off; # stream to upstream instead of buffering to disk
        proxy_buffering off; # optional, avoids response buffering
    }

    # Static files and other Streamlit routes
    location ~ ^/psd/(.*) {
        proxy_pass http://psd-analyzer:8000/psd/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # -----------------------------------------------------------
    # Pellet Reactor (FastAPI + uvicorn). Unlike the Streamlit apps it serves
    # at its own root, so STRIP the /pr/ prefix (trailing slash on proxy_pass);
    # the app's relative URLs then resolve under /pr/ in the browser.
    # -----------------------------------------------------------

    # absolute_redirect off -> emit a relative Location so the client keeps the
    # :8080 port (the container listens on :80, so an absolute redirect would
    # wrongly drop the port and bounce the user to the host's port-80 nginx).
    location = /pr { absolute_redirect off; return 301 /pr/; }
    location /pr/ {
        proxy_pass http://pellet-reactor:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 86400;
    }

    # -----------------------------------------------------------
    # Droplet model application - proxy to local Streamlit
    # -----------------------------------------------------------

    location /droplet/ {
        proxy_pass http://droplet-model:8000/droplet/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;

        # IMPORTANT for large uploads via st.file_uploader
        proxy_request_buffering off; # stream to upstream instead of buffering to disk
        proxy_buffering off; # optional, avoids response buffering
    }

    # Static files and other Streamlit routes
    location ~ ^/droplet/(.*) {
        proxy_pass http://droplet-model:8000/droplet/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # -----------------------------------------------------------
    # AC Optimizer application - proxy to local Streamlit
    # -----------------------------------------------------------

    location /aco/ {
        proxy_pass http://ac-optimizer:8000/aco/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Streamlit
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;

        # IMPORTANT for large uploads via st.file_uploader
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Static files and other Streamlit routes
    location ~ ^/aco/(.*) {
        proxy_pass http://ac-optimizer:8000/aco/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # -----------------------------------------------------------
    # Gantt chart application
    # -----------------------------------------------------------

    location /gantt {
        proxy_pass http://gantt-frontend/gantt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------------
    # Pulse application
    # -----------------------------------------------------------

    # Pulse is routed by regex alone, so a bare /pulse matches no location and
    # 404s. Send it to the trailing-slash form the regex does match.
    location = /pulse { return 301 /pulse/; }

    location ~ ^/pulse/(.*)$ {
        proxy_pass http://pulse:5000/pulse/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }    

    # CEIC dryer application
    location = /dryer { absolute_redirect off; return 301 /dryer/; }
    location /dryer/ {
        proxy_pass http://ceic-dryer:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 86400;
    }
}
